name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Gate jobs only call `nix build .#checks.<sys>.<name>`, so no `nix develop`
# default shell is needed. The check logic lives in flake.nix.
permissions:
  contents: read

jobs:
  # One job per flake check, so a failure names the check that failed.
  # `name:` keeps the job (and thus the required-status-check) named after the
  # check itself rather than GitHub's default "checks (build)" form.
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - build
          - elm-test
          - gotest
          - golangci-lint
          - formatting
          - module-eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          # The action SHA only pins the action; the hestia binary it
          # downloads defaults to "latest". Pin that too.
          version: v3.0.0

      - name: ${{ matrix.check }}
        run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  # prek runs pre-commit hooks (shellcheck, large-file checks, etc.) that are
  # not flake checks; it needs the devShell tools, so it stays on `nix develop`.
  prek:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          # The action SHA only pins the action; the hestia binary it
          # downloads defaults to "latest". Pin that too.
          version: v3.0.0

      - name: Lint
        run: prek run --all-files --show-diff-on-failure
